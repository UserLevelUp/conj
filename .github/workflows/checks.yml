name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence-and-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3'
      - run: python tools/verify_evidence.py
      - run: python tools/check_publication.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_c15.py --verify docs/c15-checks.json
      - run: mkdir -p work && python main.conjectures.sanity.py --output work/checks.json
